# Mirrored items that deliberately have no benchmark.
#
# `make bench-check` requires every item in `hachi/src` whose docstring carries a
# ``Mirrors `<ArkLib name>` `` line to be either benched -- a `// @covers` marker
# on a `bench_case!` -- or listed here. Silence is not an exclusion: an operation
# nobody measures is one the optimization loop cannot notice a regression in, and
# "we forgot" and "it is not worth measuring" must not look the same from the
# outside.
#
# The bar for a line here is that a criterion run on the item would measure the
# *harness* rather than the item: a type with no runtime, or straight-line code
# with no loop and no allocation. It is NOT "this seemed slow to benchmark" and
# it is NOT "this is not on the hot path" -- `commit::l1_norm` is nobody's hot
# path and it is benched. If an item does real work at any size, bench it.
#
# One signed-off exception class exists alongside that bar (the "infeasible at
# [NOZ26] Fig. 9 scale" section below): operations whose cost is pinned by the
# `params.rs` constants to hours per criterion iteration under schoolbook
# `ring::mul`. That is a *policy* exception -- explicitly not "seemed slow" but
# "provably cannot complete" -- decided by the user on 2026-08-28
# (PLAN_PAPER_PARAMS.md, Decision 3) and recorded in NOTES.md ("Adopting the
# paper's parameters"). Every entry in that section names the arithmetic that
# makes it infeasible and the condition for its removal: a sub-quadratic
# `ring::mul` champion landing.
#
# Each entry must say *why*, in a form that can be checked by reading the item.
#
# The `const`s in `hachi/src/params.rs` are absent from this file on purpose:
# they carry no `Mirrors` marker, because a const is a *value chosen for a
# generic ArkLib parameter* rather than a translation of a definition
# (`RING_LOG_DEGREE` is the argument `α` of `hachiModulus`, not `hachiModulus`).
# Never mirrored, so never owed a bench, so nothing to excuse -- and `params` is
# the one module with no `[[bench]]` target at all.

[exclusions]

# -- types -------------------------------------------------------------------
#
# A struct declaration has no runtime, and `rustitems.benchable()` excludes
# `struct` outright, so these can never be benched even in principle: a marker
# on a type always implies a line here. The operations over each type are
# benched individually.

"ring::Rq" = "a type declaration, not code -- the negacyclic ring's fourteen operations are benched separately"
"linalg::PolyVec" = "a type declaration, not code; its operations are benched separately"
"linalg::PolyMatrix" = "a type declaration, not code; `mat_vec_mul` is where its runtime is"
"commit::PublicParams" = "a type declaration, not code -- a pair of gadget matrices; building it is `PublicParams::new`, which mirrors nothing"
"commit::Decomp" = "a type declaration, not code -- the decomposition record `generate_decomps` produces, and that is the benched item"
"commit::Opening" = "a type declaration, not code -- the opening record `verify_weak` consumes, and that is the benched item"
"evalsplit::MlPoly" = "a type declaration, not code -- the monomial-coefficient vector; its reshape and evaluation are benched separately"
"evalsplit::MlEvals" = "a type declaration, not code -- the hypercube-value vector; its reshape and evaluation are benched separately"

# -- O(1) by inspection ------------------------------------------------------
#
# Straight-line code: no loop, no allocation, no call that has either. A case
# over one of these would time the `black_box` around it. Both bodies are short
# enough to check the claim by reading them.

"ring::Rq::coeff" = """
one bounds compare and one index (`hachi/src/ring.rs`): `if k < self.0.len()
{ self.0[k] } else { Fp::ZERO }`. No loop, no allocation. It is also measured
through every operation above it -- `mul` alone performs `N²` coefficient
reads -- so a regression here could not hide."""

"commit::centered_abs" = """
one shift, one compare, one subtraction on a single `Fp` (`hachi/src/commit.rs`):
`q / 2` folds at compile time because `Q` is a `const`, leaving
`if v <= half { v } else { q - v }`. Per-coefficient work with no loop of its
own; it is measured at scale through `l1_norm`, `l_infty_norm` and
`l2_norm_sq`, all three of which are benched."""

"evalsplit::split_equiv" = """
one `usize` multiplication by a const and one addition
(`hachi/src/evalsplit.rs`): `y + ML_LOW_LEN * x`. No loop, no allocation; it is
also measured through both reshapes, which call it per entry."""

"evalsplit::split_equiv_inv" = """
one `usize` division and one remainder by a const
(`hachi/src/evalsplit.rs`): `(k / ML_LOW_LEN, k % ML_LOW_LEN)`. No loop, no
allocation; measured through `to_polynomial`, which calls it per entry."""

# -- infeasible at [NOZ26] Fig. 9 scale (signed-off policy exception) ---------
#
# See the header for the bar this section is an exception to, the sign-off, and
# the removal condition. Common arithmetic: one schoolbook `ring::mul` at
# `RING_DEGREE = 1024` is `2^20` field operations (~2-4 ms); one message block
# is `MESSAGE_ROWS · GADGET_DIGITS = 8192` ring elements wide, so anything that
# multiplies through the inner matrix `A` (`1 × 8192`) pays >= 8192 ring muls
# (~tens of seconds) *per block*, at any block count -- and the scheme has
# `BLOCKS = 1024` of them. The case bodies are retained (unregistered) in the
# bench files, and the semantics they exercised run on demand via the
# `#[ignore]`d full-const tests (`cargo test --release -- --ignored`).

"commit::generate_decomps" = """
per block: one `gadget_decompose` (8192 digit loops), one `A · s` (8192 ring
muls, ~25 s at d = 1024 schoolbook), one more decompose. Hours at the scheme's
`BLOCKS = 1024`; tens of seconds per iteration even at one block. Excluded per
the Fig. 9 policy exception (header) until a sub-quadratic `ring::mul` lands."""

"commit::commit_with_decomps" = """
`B · flatten(t̂)`: `BLOCKS · (INNER_ROWS · GADGET_DIGITS) = 8192` ring muls,
~25 s per iteration at d = 1024 schoolbook. Excluded per the Fig. 9 policy
exception (header) until a sub-quadratic `ring::mul` lands."""

"commit::derived_message" = """
per block: `gadget_mul` at `MESSAGE_ROWS = 1024` rows -- 8192 ring muls
(~25 s) per block, `BLOCKS = 1024` blocks. Excluded per the Fig. 9 policy
exception (header) until a sub-quadratic `ring::mul` lands."""

"commit::commit" = """
`generate_decomps` + `commit_with_decomps`: ~2^23 ring muls at the scheme's
shapes -- hours per criterion iteration. Excluded per the Fig. 9 policy
exception (header) until a sub-quadratic `ring::mul` lands."""

# --- quadeval: TWO different walls, and they must not be conflated ----------
#
# W4 (memory). The QuadEval witness `message` is `BLOCKS` blocks of
# `MESSAGE_ROWS · GADGET_DIGITS = 8192` ring elements, i.e. `2^23` elements of
# 8 KiB = **64 GiB** -- larger than this machine, and 8x the ~8 GiB undecomposed
# message. Nothing about `ring::mul` changes that: the removal condition is a
# blockwise/streaming witness API, **not** the multiplication champion. Every
# entry below marked W4 inherits that, and a sub-quadratic mul does NOT retire
# it.
#
# W1 (multiplication width). `relOut`'s three `1 x 8192` mat-vecs are 24 576 of
# its 28 672 ring muls (86%); those do retire with a mul champion, but the
# functions that carry them are W4-blocked first.

"quadeval::PublicParamsD" = """
a struct: two matrix fields, no computation. Types are excluded by
construction (`rustitems.benchable()` excludes `struct`), like every other
mirrored type in this crate."""

"quadeval::QuadEvalStatement" = """
a struct: four data fields, no computation. See `quadeval::PublicParamsD`."""

"quadeval::QuadEvalResponse" = """
a struct: three data fields, no computation. See `quadeval::PublicParamsD`."""

"quadeval::carrier" = """
W4 + W1: `blocks` x `carrier_entry`, i.e. `2^r · 2^m = 2^20` ring muls (~26 min
at d = 1024 schoolbook), over a `blocks x 8192` witness that is 64 GiB at
Fig. 9. `carrier_entry` itself is benched at a REDUCED row count."""

"quadeval::carrier_decomp" = """
W4: `carrier` plus `2^r · δ · d` digit steps. The digit layer is measured
directly as `gadget/balanced_gadget_decompose`; what cannot run here is the
64 GiB witness `carrier` reads."""

"quadeval::carrier_commit" = """
W4 + W1: `carrier_decomp` plus `dRows · (2^r · δ) = 8192` ring muls. Blocked by
the witness before the multiplication."""

"quadeval::honest_z" = """
W4 + W1, and the target's dominant term: `2^r · n = 2^23` full ring products
(`scalarVecMul` multiplies by a ring element, not a constant) -- the same order
as `commit::commit`, hours per criterion iteration -- over the 64 GiB witness.
Both walls fire; the memory one is not removed by a mul champion."""

"quadeval::honest_compute_v" = """
W4 + W1: `carrier_commit` under another name (`QuadEval/Reduction.lean`)."""

"quadeval::honest_compute_resp" = """
W4 + W1: `carrier_decomp` + `honest_z` + the bounded z decomposition,
~2^23 + 2^20 ring muls over the 64 GiB witness."""

"quadeval::j_mul" = """
a params-fixed wrapper over `gadget::gadget_mul_z` at the scheme's
`n = MESSAGE_ROWS · GADGET_DIGITS = 8192`, whose input `ẑ` alone is
`n · Z_DIGITS = 40960` ring elements = 320 MiB. The operation itself is
measured as `gadget/gadget_mul_z` at a REDUCED row count; a case here would
measure the 320 MiB corpus."""

"quadeval::rel_out" = """
W1 (and W4 through the witness that produces its response): 28 672 ring muls
per call, ~43 s per iteration, of which the three `1 x 8192` mat-vecs are 86%.
Retires with a sub-quadratic `ring::mul` champion -- unlike the W4 entries
above. Its cheap conjunct, the box test, is benched as `quadeval/in_sb`."""

"quadeval::paper_rel_out" = """
W1: `rel_out` with the box check in place of the ball; the same 28 672 ring
muls dominate. Its distinguishing conjunct is benched as
`quadeval/vec_in_sb`."""

