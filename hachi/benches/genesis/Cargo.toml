[package]
name = "hachi-genesis"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Frozen first-translation snapshot of hachi, kept only so `make run-bench` can re-measure the starting point on the same machine, in the same run, as the current code"

[lib]
name = "hachi_genesis"
path = "src/lib.rs"
# The frozen modules are byte-for-byte copies of `hachi/src/*.rs`, doc examples
# included, and those examples say `use hachi::…`. They are compiled and checked
# in the real crate; running them again here would only test that a copy of a
# doctest still names the crate it was copied from.
doctest = false

# One dependency, and only because the frozen modules cannot compile without it:
# `hachi` reaches its coefficient field through `cpoly`, so a frozen copy of a
# `hachi` module needs the same field. Pinned to the *same* `rev` as
# `hachi/Cargo.toml`, which is what makes it compatible with the "no drift" rule
# this crate is really about -- see src/lib.rs for the full reasoning.
[dependencies]
cpoly = { git = "https://github.com/tobias-rothmann/AeneasCompPoly.git", rev = "583cfaff0617180764ffd849d867331af206fc5e" }
